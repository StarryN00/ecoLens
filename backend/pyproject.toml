[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501",   # line too long — handled by formatter, not enforced here
    "B008",   # do not perform function calls in default arguments (FastAPI Depends pattern)
    "B904",   # within except clause, use raise ... from err (too noisy for now)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
